name: App Android (Diario Uscite)

on:
  push:
    paths:
      - "outdoor-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "outdoor-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: outdoor-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari (GPX, statistiche, database)
        run: ./gradlew :core:track:test :app:testDebugUnitTest --stacktrace

      - name: Compilazione APK (debug e release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: diario-uscite-apk
          path: outdoor-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # L'APK release viene pubblicato (sovrascrivendo) sul branch "apk", così si scarica
      # direttamente dal telefono: https://github.com/SansoAle/SansoAle.github.io/raw/apk/diario-uscite.apk
      - name: Pubblica l'APK sul branch apk
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/apk/diario-uscite.apk
          cd /tmp/apk
          echo "APK release compilato dal commit ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})" > LEGGIMI.txt
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "APK da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Carica report dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: |
            outdoor-app/core/track/build/reports/tests/
            outdoor-app/app/build/reports/tests/
