name: App Android (Diario Uscite)

on:
  push:
    paths:
      - "outdoor-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "outdoor-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: outdoor-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari (GPX, statistiche, database)
        run: ./gradlew :core:track:test :app:testDebugUnitTest --stacktrace

      - name: Compilazione APK (debug e release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: diario-uscite-apk
          path: outdoor-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Carica report dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: |
            outdoor-app/core/track/build/reports/tests/
            outdoor-app/app/build/reports/tests/
